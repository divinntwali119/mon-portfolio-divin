<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan confirmé — Divin Ntwali</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0d0d0d 0%, #1a1a1a 100%);
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(220,38,38,0.25) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }
    .card {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 56px 48px;
      max-width: 520px;
      width: 90%;
      text-align: center;
      animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .check-circle {
      width: 100px; height: 100px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 8px rgba(220,38,38,0.15), 0 0 0 20px rgba(220,38,38,0.07);
      animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
    }
    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    .check-circle i {
      font-size: 48px;
      color: #fff;
      animation: checkIn 0.5s ease 0.7s both;
    }
    @keyframes checkIn {
      from { opacity: 0; transform: scale(0.5) rotate(-45deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      animation: fadeIn 0.6s ease 0.9s both;
    }
    .subtitle {
      font-size: 15px;
      color: #b0b0b0;
      line-height: 1.6;
      margin-bottom: 32px;
      animation: fadeIn 0.6s ease 1s both;
    }
    .subtitle strong { color: #fff; }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
      animation: fadeIn 0.6s ease 1.1s both;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #dc2626 0%, #f87171 100%);
      border-radius: 2px;
      animation: fillBar 2.5s cubic-bezier(0.4, 0, 0.2, 1) 1.3s forwards;
    }
    @keyframes fillBar {
      from { width: 0; }
      to { width: 100%; }
    }
    .status {
      font-size: 12px;
      color: #888;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      animation: fadeIn 0.6s ease 1.1s both;
    }
    .status i { color: #dc2626; margin-right: 6px; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .btn-continue {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 30px;
      padding: 14px 32px;
      background: #dc2626;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
      opacity: 0;
      animation: fadeIn 0.6s ease 3.8s forwards;
    }
    .btn-continue:hover {
      background: #b91c1c;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(220,38,38,0.3);
    }
    .btn-continue i { transition: transform 0.3s; }
    .btn-continue:hover i { transform: translateX(4px); }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="card">
    <div class="check-circle">
      <i class="fas fa-check"></i>
    </div>

    <h1>QR Code scanné avec succès</h1>
    <p class="subtitle">
      Bienvenue sur la carte de visite numérique de <strong>Divin Ntwali</strong>.<br>
      Redirection vers le portfolio en cours…
    </p>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="status">
      <i class="fas fa-circle-notch fa-spin"></i> Chargement du portfolio
    </div>

    <a href="index.html#scan-banner" class="btn-continue">
      Continuer maintenant <i class="fas fa-arrow-right"></i>
    </a>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "index.html#scan-banner";
    }, 4000);
  </script>
</body>
</html>
